# The whole pipeline on one machine — see docs/local-development.md for the
# walkthrough, the tunnel step, and named limitations.
#
# Every env var each service needs is listed explicitly below — one file to
# see the whole shape. Non-secret values (the local Temporal connection, the
# specialist image) are real, working defaults. Secrets (Anthropic, GitHub,
# Linear) are left empty on purpose, since this file is tracked: copy
# docker-compose.override.yml.example to docker-compose.override.yml
# (gitignored, merged automatically by `docker compose`) and put your real
# values there. Compose merges `environment:` maps key by key, so the
# override only names the keys it sets.
#
# What runs:
#   - postgresql / temporal / temporal-ui: a local Temporal server
#     (temporalio/auto-setup).
#   - webhook-listener: the shaping tier, receiving the tracker's webhooks.
#   - dispatch-worker: the development tier's Temporal worker. It launches
#     each specialist as its own container on this machine's Docker engine,
#     through the mounted socket.
#   - specialist-runner: only builds the image dispatch-worker launches.
#
# Linear, GitHub and Anthropic stay real and external; nothing here emulates
# them. A tunnel (cloudflared or similar) is how a real Linear webhook
# reaches the composed webhook-listener.

services:
  postgresql:
    image: postgres:15
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      # "postgresql" is rejected by temporalio/auto-setup's own entrypoint —
      # confirmed against its actual error message ("Unsupported driver...
      # Valid drivers are: mysql8, postgres12, postgres12_pgx, cassandra"),
      # not assumed.
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:latest
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  # Builds the specialist image and exits. Nothing runs the specialist as a
  # compose service: dispatch-worker launches one container per dispatch,
  # through the Docker engine, from this image. Listing it here is what makes
  # `docker compose up --build` build it.
  specialist-runner:
    build:
      context: ./specialist-runner
    image: specialist-runner:local
    entrypoint: ["true"]
    restart: "no"

  webhook-listener:
    build:
      context: .
      dockerfile: webhook-listener/Dockerfile
    environment:
      PORT: "8787"
      DEBOUNCE_MS: "15000"
      LOG_LEVEL: trace
      LINEAR_API_URL: ""
      LINEAR_MCP_URL: ""
      GITHUB_MCP_URL: ""
      TEST_STAGE: ""
      PRODUCT_CONTEXT_PATHS: ""
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: dispatch-task-queue
      TEMPORAL_TLS: "false"
      # A local dev Temporal server has no namespace auth at all — leave
      # empty even in the override file.
      TEMPORAL_API_KEY: ""
      # Secrets — set real values in docker-compose.override.yml.
      LINEAR_WEBHOOK_SECRET: ""
      LINEAR_AGENT_API_KEY: ""
      AGENT_USER_ID: ""
      GITHUB_TOKEN: ""
      ANTHROPIC_API_KEY: ""
    ports:
      - "8787:8787"
    depends_on:
      - temporal

  dispatch-worker:
    build:
      context: ./dispatch-worker
    environment:
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: dispatch-task-queue
      TEMPORAL_TLS: "false"
      TEMPORAL_API_KEY: ""
      LOG_LEVEL: debug
      LINEAR_API_URL: ""
      # Secrets — set real values in docker-compose.override.yml.
      GITHUB_TOKEN: ""
      LINEAR_AGENT_API_KEY: ""
      # Reviewer-of-record's static email->GitHub-login table (JSON object
      # string). Optional — unset just skips requesting a reviewer.
      REVIEWER_EMAIL_TO_GITHUB_LOGIN: ""
      # The Docker launcher (src/launchers/docker-launcher.ts): which image
      # to run per dispatch, and which of this service's own variables the
      # specialist also gets. The per-dispatch variables (STORY_ID and the
      # rest) are added by the worker itself.
      SPECIALIST_IMAGE: specialist-runner:local
      SPECIALIST_FORWARD_ENV: ANTHROPIC_API_KEY,GITHUB_TOKEN,LINEAR_AGENT_API_KEY,FRAMEWORK_REPO,FRAMEWORK_REF,CLAUDE_MODEL,CLAUDE_EFFORT
      ANTHROPIC_API_KEY: ""
      CLAUDE_MODEL: claude-opus-5-5
      CLAUDE_EFFORT: high
      # The framework clone the specialist reads its agent and skill files
      # from. A placeholder on purpose: set your fork in
      # docker-compose.override.yml, and point FRAMEWORK_REF at a branch when
      # testing framework changes.
      FRAMEWORK_REPO: example-org/intent-to-production
      FRAMEWORK_REF: main
    # Root, because the engine socket is owned by root on most hosts and the
    # image's own user cannot open it. Access to that socket is root on the
    # host either way, so this widens nothing that mounting it had not already.
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      temporal:
        condition: service_started
      specialist-runner:
        condition: service_completed_successfully

volumes:
  postgresql-data:
