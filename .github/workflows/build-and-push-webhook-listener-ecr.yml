name: Build and push webhook-listener image to ECR

# Fires when a PR targeting main is merged, and can also be run manually
# from the Actions tab (e.g. to rebuild/push without a fresh merge).
on:
  push:
    paths:
      - "webhook-listener/**"
    branches:
      - dev
  pull_request:
    types: [closed]
    paths:
      - "webhook-listener/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or commit SHA) to build. Leave blank to build whatever ref this run was dispatched from."
        required: false
        type: string

permissions:
  contents: read

# Prevents two pushes to the same tags from racing each other (e.g. a manual
# run kicked off right after a merge fires).
concurrency:
  group: ecr-push-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # `closed` fires on every PR close, merged or not — merged is the only
    # one we want. pull_request (unlike pull_request_review) is already
    # fork-isolated by GitHub itself: a PR from a fork runs with no access to
    # this repo's secrets, so configure-aws-credentials below simply fails
    # rather than silently running with real AWS access in that case. Merging
    # into a protected main branch already requires write access on GitHub's
    # side, so no extra author_association check is needed here.
#    if: >
#      github.event_name == 'workflow_dispatch' ||
#      (
#        github.event_name == 'pull_request' &&
#        github.event.pull_request.merged == true &&
#        github.event.pull_request.base.ref == 'main'
#      )
    env:
      ECR_REPOSITORY: intent-to-production
    steps:
      - name: Resolve which commit to build
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # The actual merge commit that landed on main — not head.sha,
            # which is the PR branch's pre-merge tip.
            sha="${{ github.event.pull_request.merge_commit_sha }}"
          elif [ -n "${{ inputs.ref }}" ]; then
            sha="${{ inputs.ref }}"
          else
            sha="${{ github.sha }}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      # Static long-lived credentials, not OIDC role assumption — the action
      # reads these from `with:` (its own inputs) and exports them via
      # $GITHUB_ENV so every later step in this job inherits them. Setting
      # them as step-level `env:` instead (as this used to do) does neither:
      # the action never receives them as inputs, and step-scoped env vars
      # don't carry forward to later steps regardless — which is exactly why
      # amazon-ecr-login was failing with "Could not load credentials from
      # any providers" two steps downstream.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Idempotent — creates the private repo on first run, no-ops after
      # that. Drop this step if the repo is provisioned via IaC instead and
      # the push role shouldn't have create/describe permissions.
      - name: Ensure the ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "$ECR_REPOSITORY" \
            --image-scanning-configuration scanOnPush=true

      - name: Compute image tags
        id: tags
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          short_sha="$(echo "${{ steps.resolve.outputs.sha }}" | cut -c1-12)"
          {
            echo "tags<<EOF"
            echo "$REGISTRY/$ECR_REPOSITORY:$short_sha"
            echo "$REGISTRY/$ECR_REPOSITORY:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build context is the repo root, not webhook-listener/ — the
      # Dockerfile copies agents/ and skills/ from two levels above
      # webhook-listener/src, matching how prompt-assembly.ts and skills.ts
      # resolve those paths at runtime.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: webhook-listener/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max