name: No private references

# Enforces CLAUDE.md's "No Private References" rule: nothing in this repository
# may reference a private tracker team or issue, a client organization or repo,
# a person, or a named deployed environment. The rule was violated within an
# hour of being written down, which is why it is checked here rather than
# remembered.
#
# ---------------------------------------------------------------------------
# TEMPORARILY NOT GATING (2026-08-24). Manual dispatch only.
#
# The repository is compliant except for eight references that are live
# deployment identity. Fixing them changes deployed state, so they cannot be
# scrubbed on the same schedule as everything else, and a permanently red
# required check is worse than an honestly disabled one — a gate everyone
# learns to scroll past stops being a gate.
#
# The script itself is unchanged and still correct. Run it any time:
#
#     node scripts/check-no-private-references.mjs
#
# To re-enable, restore the trigger block below and clear these eight:
#
#   1-3. infrastructure/cdktf.json — reviewer-email-to-github-login carries
#        three real addresses. Fixable without touching deployed state: it is
#        an input value, not a resource name. Move it to SSM and reference it
#        by ARN in temporal-workers.ts's `secrets` block, the way every other
#        secret here already works. Do this one first — they are other
#        people's email addresses and this repo is headed public.
#     4. infrastructure/cdktf.json — parameter-prefix names a real SSM path.
#        Renaming orphans every existing parameter; needs a migration.
#     5. infrastructure/stacks/specialist-sandbox.ts — the ECS cluster name.
#        Renaming destroys and recreates the cluster.
#     6. infrastructure/stacks/temporal-workers.ts — same, for its cluster.
#   7-8. framework-repo in cdktf.json and docker-compose.yml. Arguably not
#        violations at all: they point at this repo, which is public. The fix
#        is to narrow the rule so a public repo's own coordinate is exempt,
#        not to break working config.
#
# The structural fix that retires items 4-6 for good: commit generic example-*
# defaults in cdktf.json and inject the real values at deploy time via context
# overrides. That is a change to how deploys work, not a scrub, which is why
# it is named here rather than attempted.
#
# on:
#   pull_request:
#   push:
#     branches: [main, dev]
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No dependencies: the check reads `git ls-files` and the working tree
      # with Node built-ins only, so it needs no install step and cannot be
      # broken by a lockfile change.
      - name: Check for private references
        run: node scripts/check-no-private-references.mjs
